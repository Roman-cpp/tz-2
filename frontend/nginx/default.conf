# Frontend отдаёт статику и проксирует API на бэкенд, как это делает
# Vite-прокси в dev (frontend/vite.config.ts).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(companies|offers|streams)(/|$) {
        # Заголовки (включая X-Api-Key) уходят на backend без изменений
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
